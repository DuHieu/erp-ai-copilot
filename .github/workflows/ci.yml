name: ERP AI Copilot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ERP.AI.sln

    - name: Build solution (Release)
      run: dotnet build ERP.AI.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test ERP.AI.sln --configuration Release --no-build --verbosity normal

  docker-build-verify:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image — API
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.api
        push: false
        tags: erp-ai-api:ci-test

    - name: Build Docker Image — Web UI
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.web
        push: false
        tags: erp-ai-web:ci-test

    - name: Build Docker Image — Document Parser Sidecar
      uses: docker/build-push-action@v5
      with:
        context: services/document-parser
        file: services/document-parser/Dockerfile
        push: false
        tags: erp-ai-document-parser:ci-test

    - name: Build Docker Image — Embedding Service Sidecar
      uses: docker/build-push-action@v5
      with:
        context: services/embedding-service
        file: services/embedding-service/Dockerfile
        push: false
        tags: erp-ai-embedding-service:ci-test
