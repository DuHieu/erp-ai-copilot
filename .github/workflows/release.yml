name: ERP AI Copilot Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Publish GHCR Images & Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ERP.AI.sln

    - name: Build solution (Release)
      run: dotnet build ERP.AI.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test ERP.AI.sln --configuration Release --no-build --verbosity normal

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Normalize Repository Owner String
      id: repo_owner
      run: echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    # --- API Image Tags & Push ---
    - name: Extract Docker Metadata — API
      id: meta_api
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ steps.repo_owner.outputs.owner }}/erp-ai-api
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{raw}}
          type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

    - name: Build and Push Docker Image — API
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.api
        push: true
        tags: ${{ steps.meta_api.outputs.tags }}
        labels: ${{ steps.meta_api.outputs.labels }}
        cache-from: type=gha,scope=erp-ai-api
        cache-to: type=gha,mode=max,scope=erp-ai-api

    # --- Web Image Tags & Push ---
    - name: Extract Docker Metadata — Web UI
      id: meta_web
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ steps.repo_owner.outputs.owner }}/erp-ai-web
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{raw}}
          type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

    - name: Build and Push Docker Image — Web UI
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.web
        push: true
        tags: ${{ steps.meta_web.outputs.tags }}
        labels: ${{ steps.meta_web.outputs.labels }}
        cache-from: type=gha,scope=erp-ai-web
        cache-to: type=gha,mode=max,scope=erp-ai-web

    # --- Document Parser Image Tags & Push ---
    - name: Extract Docker Metadata — Document Parser
      id: meta_parser
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ steps.repo_owner.outputs.owner }}/erp-ai-document-parser
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{raw}}
          type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

    - name: Build and Push Docker Image — Document Parser
      uses: docker/build-push-action@v5
      with:
        context: services/document-parser
        file: services/document-parser/Dockerfile
        push: true
        tags: ${{ steps.meta_parser.outputs.tags }}
        labels: ${{ steps.meta_parser.outputs.labels }}
        cache-from: type=gha,scope=erp-ai-document-parser
        cache-to: type=gha,mode=max,scope=erp-ai-document-parser

    # --- Embedding Service Image Tags & Push ---
    - name: Extract Docker Metadata — Embedding Service
      id: meta_embed
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ steps.repo_owner.outputs.owner }}/erp-ai-embedding-service
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{raw}}
          type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

    - name: Build and Push Docker Image — Embedding Service
      uses: docker/build-push-action@v5
      with:
        context: services/embedding-service
        file: services/embedding-service/Dockerfile
        push: true
        tags: ${{ steps.meta_embed.outputs.tags }}
        labels: ${{ steps.meta_embed.outputs.labels }}
        cache-from: type=gha,scope=erp-ai-embedding-service
        cache-to: type=gha,mode=max,scope=erp-ai-embedding-service

    # --- GitHub Release Creation ---
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "ERP AI Copilot ${{ github.ref_name }}"
        body: |
          # ERP AI Copilot ${{ github.ref_name }}

          Phase 2.3 includes grounded Knowledge RAG, source citations, no-evidence refusal, local vector embeddings, and Qdrant-backed semantic search for ERP knowledge documents.

          ## Published Docker Images

          - `ghcr.io/${{ steps.repo_owner.outputs.owner }}/erp-ai-api:${{ github.ref_name }}`
          - `ghcr.io/${{ steps.repo_owner.outputs.owner }}/erp-ai-web:${{ github.ref_name }}`
          - `ghcr.io/${{ steps.repo_owner.outputs.owner }}/erp-ai-document-parser:${{ github.ref_name }}`
          - `ghcr.io/${{ steps.repo_owner.outputs.owner }}/erp-ai-embedding-service:${{ github.ref_name }}`

          ## Release Quick Start

          ```bash
          curl -O https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.release.yml
          ERP_AI_VERSION=${{ github.ref_name }} docker compose -f docker-compose.release.yml up -d
          ```
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
