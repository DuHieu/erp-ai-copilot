name: ERP AI Copilot Sidecar Docker Verify

on:
  push:
    branches: [ "main" ]
    paths:
      - "services/document-parser/**"
      - "services/embedding-service/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "services/document-parser/**"
      - "services/embedding-service/**"
  workflow_dispatch:

jobs:
  sidecar-docker-build-verify:
    name: Verify Sidecar Docker Builds
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image - Document Parser Sidecar
      uses: docker/build-push-action@v5
      with:
        context: services/document-parser
        file: services/document-parser/Dockerfile
        push: false
        tags: erp-ai-document-parser:ci-test
        cache-from: type=gha,scope=erp-ai-document-parser
        cache-to: type=gha,mode=max,scope=erp-ai-document-parser

    - name: Build Docker Image - Embedding Service Sidecar
      uses: docker/build-push-action@v5
      with:
        context: services/embedding-service
        file: services/embedding-service/Dockerfile
        push: false
        tags: erp-ai-embedding-service:ci-test
        cache-from: type=gha,scope=erp-ai-embedding-service
        cache-to: type=gha,mode=max,scope=erp-ai-embedding-service
